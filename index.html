    if (!events[evt]) return;
    events[evt] = events[evt].filter(fn => fn !== cb);
  }
  function emit(evt, data) {
    if (!events[evt]) return;
    events[evt].forEach(cb => { try { cb(data); } catch (e) { console.error(e); } });
  }

  // ── 数据层 ──
  function getSettings() {
    try {
      const s = localStorage.getItem(STORAGE_KEY_SET);
      return s ? { ...DEF_SET, ...JSON.parse(s) } : { ...DEF_SET };
    } catch { return { ...DEF_SET }; }
  }
  function saveSettings(d) {
    localStorage.setItem(STORAGE_KEY_SET, JSON.stringify(d));
    emit('settingsChanged', d);
  }
  function getLinks() {
    try {
      const l = localStorage.getItem(STORAGE_KEY_LINKS);
      if (!l) { saveLinks([...DEF_LINKS]); return [...DEF_LINKS]; }
      return JSON.parse(l);
    } catch { return [...DEF_LINKS]; }
  }
  function saveLinks(a) {
    localStorage.setItem(STORAGE_KEY_LINKS, JSON.stringify(a));
    emit('linksChanged', a);
  }
  function getPluginState() {
    try {
      const p = localStorage.getItem(STORAGE_KEY_PLUGINS);
      return p ? JSON.parse(p) : {};
    } catch { return {}; }
  }
  function savePluginState(obj) {
    localStorage.setItem(STORAGE_KEY_PLUGINS, JSON.stringify(obj));
  }

  function updateSEOMeta(seo) {
    if (!seo) return;
    const setMeta = (sel, val, attr = 'content') => {
      if (!val) return;
      let el = document.querySelector(sel);
      if (!el) {
        el = document.createElement('meta');
        const mName = sel.match(/name="([^"]+)"/);
        const mProp = sel.match(/property="([^"]+)"/);
        if (mName) el.setAttribute('name', mName[1]);
        if (mProp) el.setAttribute('property', mProp[1]);
        document.head.appendChild(el);
      }
      el.setAttribute(attr, val);
    };
    const setLink = (rel, href) => {
      if (!href) return;
      let el = document.querySelector(`link[rel="${rel}"]`);
      if (!el) {
        el = document.createElement('link');
        el.setAttribute('rel', rel);
        document.head.appendChild(el);
      }
      el.setAttribute('href', href);
    };

    if (seo.title) document.title = seo.title;
    setMeta('meta[name="description"]', seo.description);
    setMeta('meta[name="keywords"]', seo.keywords);
    setMeta('meta[name="robots"]', seo.robots);
    setMeta('meta[name="theme-color"]', seo.themeColor);
    setMeta('meta[property="og:title"]', seo.title);
    setMeta('meta[property="og:description"]', seo.description);
    setMeta('meta[property="og:url"]', seo.siteUrl);
    setMeta('meta[property="og:image"]', seo.ogImage);
    setMeta('meta[property="og:image:alt"]', seo.ogImageAlt);
    setMeta('meta[name="twitter:card"]', seo.twitterCard);
    setMeta('meta[name="twitter:title"]', seo.title);
    setMeta('meta[name="twitter:description"]', seo.description);
    setMeta('meta[name="twitter:image"]', seo.ogImage);
    setLink('canonical', seo.canonical || seo.siteUrl);
    setLink('icon', seo.favicon);
    setLink('apple-touch-icon', seo.favicon);
  }

  async function hydrateFromApi() {
    try {
      const r = await fetch('/api/public/state');
      if (!r.ok) return;
      const data = await r.json();
      if (data?.settings) {
        localStorage.setItem(STORAGE_KEY_SET, JSON.stringify(data.settings));
        emit('settingsChanged', data.settings);
      }
      if (Array.isArray(data?.links)) {
        localStorage.setItem(STORAGE_KEY_LINKS, JSON.stringify(data.links));
        emit('linksChanged', data.links);
      }
    } catch {}
  }

  // ── 插件系统 ──
  const plugins = {}; // id -> { meta, instance }
  const pluginHooks = {
    tabs: [],      // { id, label, renderFn }
    actions: [],   // { id, html, onMount }
    widgets: [],  // { id, html, position, onMount }
    settings: []   // { id, title, renderFn }
  };

  function registerPlugin(meta, instance) {
    if (!meta || !meta.id) throw new Error('Plugin must have an id');
    if (plugins[meta.id]) unregisterPlugin(meta.id);

    plugins[meta.id] = { meta, instance };

    // 提供 admin API 给插件
    const adminAPI = {
      addTab: (label, renderFn) => {
        const tid = 'plugin-' + meta.id + '-' + Date.now();
        pluginHooks.tabs.push({ id: tid, label, renderFn, pluginId: meta.id });
        emit('adminTabAdded', { id: tid, label, pluginId: meta.id });
        return tid;
      },
      removeTab: (tid) => {
        pluginHooks.tabs = pluginHooks.tabs.filter(t => t.id !== tid);
        emit('adminTabRemoved', { id: tid });
      },
      addActionButton: (config) => {
        const aid = 'plugin-act-' + meta.id + '-' + Date.now();
        pluginHooks.actions.push({ id: aid, ...config, pluginId: meta.id });
        emit('adminActionAdded', { id: aid, pluginId: meta.id });
        return aid;
      },
      removeActionButton: (aid) => {
        pluginHooks.actions = pluginHooks.actions.filter(a => a.id !== aid);
        emit('adminActionRemoved', { id: aid });
      },
      addWidget: (html, position = 'dashboard', onMount) => {
        const wid = 'plugin-widget-' + meta.id + '-' + Date.now();
        pluginHooks.widgets.push({ id: wid, html, position, onMount, pluginId: meta.id });
        emit('adminWidgetAdded', { id: wid, position, pluginId: meta.id });
        return wid;
      },
      removeWidget: (wid) => {
        pluginHooks.widgets = pluginHooks.widgets.filter(w => w.id !== wid);
        emit('adminWidgetRemoved', { id: wid });
      },
      registerSettingPanel: (title, renderFn) => {
        const sid = 'plugin-set-' + meta.id + '-' + Date.now();
        pluginHooks.settings.push({ id: sid, title, renderFn, pluginId: meta.id });
        emit('adminSettingPanelAdded', { id: sid, title, pluginId: meta.id });
        return sid;
      },
      removeSettingPanel: (sid) => {
        pluginHooks.settings = pluginHooks.settings.filter(s => s.id !== sid);
        emit('adminSettingPanelRemoved', { id: sid });
      },
      notify: (msg, type) => emit('notify', { msg, type })
    };

    const coreAPI = {
      getSettings, saveSettings,
      getLinks, saveLinks,
      getPluginState, savePluginState,
      on, off, emit,
      version: '2.1.0'
    };

    if (typeof instance.init === 'function') {
      try { instance.init(coreAPI, adminAPI); } catch (e) { console.error('Plugin init error:', e); }
    }

    // 记录启用状态
    const ps = getPluginState();
    ps[meta.id] = { enabled: true, loadedAt: Date.now() };
    savePluginState(ps);

    emit('pluginLoaded', { id: meta.id, meta });
    console.log(`[LoliNet] Plugin loaded: ${meta.name} v${meta.version}`);
    return true;
  }

  function unregisterPlugin(id) {
    const p = plugins[id];
    if (!p) return false;
    if (typeof p.instance.destroy === 'function') {
      try { p.instance.destroy(); } catch (e) { console.error(e); }
    }
    // 清理 hooks
    pluginHooks.tabs = pluginHooks.tabs.filter(t => t.pluginId !== id);
    pluginHooks.actions = pluginHooks.actions.filter(a => a.pluginId !== id);
    pluginHooks.widgets = pluginHooks.widgets.filter(w => w.pluginId !== id);
    pluginHooks.settings = pluginHooks.settings.filter(s => s.pluginId !== id);
    delete plugins[id];

    const ps = getPluginState();
    if (ps[id]) { ps[id].enabled = false; savePluginState(ps); }

    emit('pluginUnloaded', { id });
    console.log(`[LoliNet] Plugin unloaded: ${id}`);
    return true;
  }

  function getPlugin(id) { return plugins[id] || null; }
  function listPlugins() { return Object.values(plugins).map(p => ({ ...p.meta })); }
  function getHooks() { return JSON.parse(JSON.stringify(pluginHooks)); }

  // ── 导出 ──
  global.LoliNet = global.LoliNet || {};
  global.LoliNet.Core = {
    DEF_SET, DEF_LINKS,
    getSettings, saveSettings,
    getLinks, saveLinks,
    getPluginState, savePluginState,
    updateSEOMeta,
    hydrateFromApi,
    on, off, emit,
    registerPlugin, unregisterPlugin, getPlugin, listPlugins,
    getHooks
  };

  console.log('%c LoliNet Core v2.1 ✧ 已就緒', 'color:#ff6eb4;font-size:14px;font-weight:bold');
})(window);

</script>

<script>
const skipLink = document.querySelector('.skip-link');
if(skipLink){
  skipLink.addEventListener('click', e => {
    e.preventDefault();
    const target = document.getElementById('main-content');
    target.setAttribute('tabindex', '-1');
    target.focus();
  });
}

let curCat='all',curQ='';
const queryState=new URLSearchParams(location.search);
curCat=queryState.get('cat')||'all';
curQ=queryState.get('q')||'';
document.getElementById('srch').value=curQ;
function safeColor(value){return /^#[0-9a-fA-F]{6}$/.test(value||'')?value:'#ff6eb4'}
function toSafeUrl(value){try{if(!value)return null;let c=String(value).trim();if(!/^https?:\/\//i.test(c))c='https://'+c;const url=new URL(c);return ['http:','https:'].includes(url.protocol)?url.href:null}catch{return null}}
function syncViewState(){
  const params=new URLSearchParams();
  if(curCat!=='all')params.set('cat',curCat);
  if(curQ)params.set('q',curQ);
  history.replaceState(null,'',params.size?`?${params}`:location.pathname);
}
function render(){
  const S=LoliNet.Core.getSettings(),L=LoliNet.Core.getLinks();
  const te=document.getElementById('stitle');
  te.textContent=S.title;te.dataset.t=S.title;
  document.getElementById('ssub').textContent=S.sub;
  document.getElementById('ava-img').src=S.ava;
  document.getElementById('ava-img').alt=S.title + ' 像素風格頭像';
  document.getElementById('fauthor').textContent=S.author;
  const catTitle = (curCat && curCat !== 'all') ? (curCat + ' 精選站點導覽 - ') : '';
  document.title = catTitle + S.title + ' // 個人導覽站';
  document.getElementById('nodecnt').textContent=L.length+' NODES';
  const cats=[...new Set(L.map(l=>l.cat).filter(Boolean))];
  renderCats(cats);renderGrid(L);
}
function renderCats(cats){
  const c=document.getElementById('cats');c.innerHTML='';
  const mk=(lbl,cat,idx)=>{
    const b=document.createElement('button');
    b.className='cat-btn'+(curCat===cat?' on':'');
    b.textContent=lbl;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected',curCat===cat?'true':'false');
    b.setAttribute('aria-controls','grid');
    b.setAttribute('tabindex',curCat===cat?'0':'-1');
    b.id='tab-'+cat;
    b.onclick=()=>filter(cat);
    return b;
  };
  c.appendChild(mk('ALL ✦','all',0));
  cats.forEach((ct,i)=>c.appendChild(mk(ct.toUpperCase(),ct,i+1)));
}
function renderGrid(all){
  const g=document.getElementById('grid');g.innerHTML='';
  let list=all.filter(l=>toSafeUrl(l.url));
  if(curCat!=='all')list=list.filter(l=>l.cat===curCat);
  if(curQ){const q=curQ.toLowerCase();list=list.filter(l=>
    String(l.name||'').toLowerCase().includes(q)||String(l.desc||'').toLowerCase().includes(q)||String(l.cat||'').toLowerCase().includes(q))}
  document.getElementById('result-count').textContent=`${list.length} / ${all.length} SIGNALS`;
  document.getElementById('active-filter').textContent=curCat==='all'?'ALL CHANNELS':curCat.toUpperCase();
  if(!list.length){
    const empty=document.createElement('div');empty.className='empty';empty.setAttribute('role','listitem');
    const mark=document.createElement('div');mark.style.cssText='font-size:2em;margin-bottom:8px';mark.textContent='✧';
    const text=document.createElement('div');text.style.color='var(--pink)';text.textContent='沒有找到站點節點';
    empty.append(mark,text);g.appendChild(empty);return
  }
  list.forEach((lk,i)=>{
    const href=toSafeUrl(lk.url);if(!href)return;
    const a=document.createElement('a');
    const color=safeColor(lk.clr);
    a.href=href;a.target='_blank';a.rel='noopener noreferrer';
    a.className='card';a.style.animationDelay=i*.04+'s';
    a.setAttribute('role','listitem');
    a.setAttribute('aria-label',lk.name + (lk.desc?' - '+lk.desc:''));
    const cornerTop=document.createElement('div');cornerTop.className='c-corner c-tl';cornerTop.setAttribute('aria-hidden','true');
    const cornerBottom=document.createElement('div');cornerBottom.className='c-corner c-br';cornerBottom.setAttribute('aria-hidden','true');
    const head=document.createElement('div');head.className='c-head';
    const icon=document.createElement('span');icon.className='c-ico';icon.style.color=color;icon.setAttribute('aria-hidden','true');icon.textContent=lk.ico||'✦';
    const info=document.createElement('div');const name=document.createElement('div');name.className='c-name';name.style.color=color;name.textContent=lk.name||'未命名節點';
    const url=document.createElement('div');url.className='c-url';url.textContent=href;info.append(name,url);head.append(icon,info);a.append(cornerTop,cornerBottom,head);
    if(lk.desc){const desc=document.createElement('div');desc.className='c-desc';desc.textContent=lk.desc;a.appendChild(desc)}
    if(lk.cat){const tag=document.createElement('span');tag.className='c-tag';tag.style.color=color;tag.style.borderColor=`${color}55`;tag.textContent=lk.cat;a.appendChild(tag)}
    if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      a.addEventListener('mouseenter',()=>{a.style.borderColor=color;
        a.style.boxShadow=`0 0 14px ${color}88,0 10px 30px rgba(0,0,0,.4)`});
      a.addEventListener('mouseleave',()=>{a.style.borderColor='';a.style.boxShadow='';a.style.transform=''});
      a.addEventListener('mousemove',e=>{
        const r=a.getBoundingClientRect();
        a.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
        a.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
        const rx=((e.clientY-r.top)/r.height-.5)*7;
        const ry=((e.clientX-r.left)/r.width-.5)*-7;
        a.style.transform=`translateY(-4px) rotateX(${rx}deg) rotateY(${ry}deg)`;
      });
    }
    g.appendChild(a);
  });
}
function filter(cat){
  curCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>{
    const isOn=(cat==='all'&&b.textContent.includes('ALL'))||(b.textContent===cat.toUpperCase());
    b.classList.toggle('on',isOn);
    b.setAttribute('aria-selected',isOn?'true':'false');
    b.setAttribute('tabindex',isOn?'0':'-1');
  });
  renderGrid(LoliNet.Core.getLinks());
  syncViewState();
}
document.getElementById('srch').oninput=e=>{curQ=e.target.value;renderGrid(LoliNet.Core.getLinks());syncViewState()};
document.getElementById('random-link').onclick=()=>{
  const pool=LoliNet.Core.getLinks().filter(l=>toSafeUrl(l.url));
  if(!pool.length){notify('沒有可開啟的站點','err');return}
  const pick=pool[Math.floor(Math.random()*pool.length)];
  notify(`正在開啟: ${pick.name||'未命名節點'}`);
  window.open(toSafeUrl(pick.url),'_blank','noopener');
};
document.getElementById('share-view').onclick=async()=>{
  const url=location.href;
  try{await navigator.clipboard.writeText(url);notify('目前視圖連結已複製')}catch{notify('無法存取剪貼簿，請直接複製網址','err')}
};
document.getElementById('focus-view').onclick=e=>{
  const active=document.body.classList.toggle('focus-mode');e.currentTarget.setAttribute('aria-pressed',String(active));notify(active?'已進入專注模式':'已離開專注模式');
};

  let dr=[];

    });

})();

(function(){
  const cls=['#ff6eb4','#00ff88','#00d4ff','#b44fff','#ffcc00'];
  function mk(){
    const p=document.createElement('div');p.className='ptc';

  setInterval(mk,1200);

setInterval(()=>{
  const n=new Date();
  const clock=document.getElementById('clock');
  const t=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');

const lls=['ฅ^•ﻌ•^ฅ','(≧◡≦)','(◕‿◕)♡','٩(◕‿◕)۶','(≧∇≦)/','(｡♥‿♥｡)','(=^･ω･^=)','(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧','OwO','UwU','(づ｡◕‿‿◕｡)づ'];
let li=0;
const loli=document.getElementById('loli');
loli.onclick=()=>{li=(li+1)%lls.length;loli.textContent=lls[li];loli.setAttribute('aria-label','表情: '+lls[li])};
loli.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();loli.click()}});

let nt;
function notify(msg,type='ok'){
  const el=document.getElementById('notif');
  if(!el) return;
  const c=type==='err'?'#ff4444':'var(--green)';
  el.textContent=msg;el.style.borderColor=c;el.style.color=c;
  el.style.boxShadow=`0 0 16px ${type==='err'?'rgba(255,68,68,.7)':'rgba(0,255,136,.7)'}`;
  el.classList.add('show');
  clearTimeout(nt);nt=setTimeout(()=>el.classList.remove('show'),2600);
}

let eq='',ec='uwulolinet';
document.addEventListener('keypress',e=>{
  eq+=e.key.toLowerCase();if(eq.length>ec.length)eq=eq.slice(-ec.length);
  if(eq===ec){notify('(◕‿◕)♡ 你發現了彩蛋！ ✧');loli.style.fontSize='4em'}
});

LoliNet.Core.on('settingsChanged', render);
LoliNet.Core.on('linksChanged', render);

(async function bootstrap(){
  await LoliNet.Core.hydrateFromApi();
  render();

  const S = LoliNet.Core.getSettings();
  const seo = S.seo || {};
  seo.title = S.title;
  seo.author = S.author;
  requestAnimationFrame(() => {
    if (typeof LoliNet.Core.updateSEOMeta === 'function') {
      LoliNet.Core.updateSEOMeta(seo);
      console.log('[SEO] Meta tags applied:', seo.title, seo.favicon);
    }
  });
})();

// 監聽設定變化，即時更新 SEO
LoliNet.Core.on('settingsChanged', function(S) {
  const seo = S.seo || {};
  seo.title = S.title;
  seo.author = S.author;
  if (typeof LoliNet.Core.updateSEOMeta === 'function') {
    LoliNet.Core.updateSEOMeta(seo);
    console.log('[SEO] Meta tags updated from settings change');
  }
});
console.log('%c LoliNet v2.1 ✧ 已就緒','color:#ff6eb4;font-size:16px;font-weight:bold');
console.log('%c 後台入口: ./admin/  |  彩蛋: uwulolinet','color:#00d4ff');
</script>
